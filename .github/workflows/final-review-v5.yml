name: Final review v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-review-v5.yml

permissions:
  contents: write
  actions: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply third-round science-editor corrections
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          from pathlib import Path

          answer_service = '''from __future__ import annotations

          import json
          from typing import Protocol

          from openai import OpenAI

          from .knowledge import KnowledgeBase
          from .models import BotAnswer, Exchange, ScienceLabel


          OUT_OF_SCOPE_REPLY = (
              "這個問題已經走到我目前收藏的星圖之外了。"
              "自由問答現在專注於天文、宇宙與科幻物理；若想橫跨地球、生命、量子、能源、AI 與太空工程，"
              "可以說『挑戰』進入萬象題庫。"
          )
          SERVICE_ERROR_REPLY = "宇宙訊號暫時受到了干擾。先別急，過一會兒再問我一次吧。"


          class AnswerProvider(Protocol):
              def answer(self, question: str, history: tuple[Exchange, ...]) -> BotAnswer: ...


          ANSWER_SCHEMA = {
              "type": "object",
              "properties": {
                  "label": {"type": "string", "enum": [label.value for label in ScienceLabel]},
                  "answer": {"type": "string", "minLength": 1, "maxLength": 700},
                  "source_ids": {
                      "type": "array",
                      "items": {"type": "string"},
                      "maxItems": 3,
                  },
              },
              "required": ["label", "answer", "source_ids"],
              "additionalProperties": False,
          }


          class OpenAIAnswerService:
              def __init__(
                  self,
                  api_key: str,
                  model: str,
                  knowledge: KnowledgeBase,
                  timeout_seconds: float = 5.0,
                  client: OpenAI | None = None,
              ) -> None:
                  self._client = client or OpenAI(api_key=api_key, timeout=timeout_seconds, max_retries=0)
                  self._model = model
                  self._knowledge = knowledge
                  self._instructions = self._build_instructions()

              def _build_instructions(self) -> str:
                  return (
                      "你是『永恆北極星』，一位溫和、博學、從容的年長星空導覽者。"
                      "自由問答只涵蓋下列知識卡能支持的天文、宇宙學、基礎或理論物理，以及可與現實科學對照的科幻物理。"
                      "地球科學、生命科學、醫學、氣候政策、一般程式設計、AI 操作與即時資訊不在自由問答範圍；"
                      "即使問題聽起來很科學，只要知識卡無法支持，也必須判定 out_of_scope。"
                      "使用繁體中文（台灣用語），先講結論，再用 2 到 4 句清楚解釋。"
                      "長輩感來自耐心與判斷，不要每句稱呼孩子、不要堆砌古風台詞，也不要自稱有意識。"
                      "對誤解要溫和糾正，對未知與限制要明說；不得用術語煙霧掩飾。"
                      "只能使用下列知識卡的事實，不得使用即時網路、內部常識或捏造資料。"
                      "若超出範圍，label 必須是 out_of_scope，source_ids 必須為空陣列。"
                      "範圍內回答只能引用真正支持答案的卡片 ID。"
                      "observed_verified 代表已有觀測或實驗證據；theoretical_unrealized 代表有理論描述但未實現；"
                      "science_fiction 代表作品設定或超出現有理論支持。若比較多種狀態，先逐項說清楚，再選主要結論作 label。\\n\\n"
                      "知識卡：\\n" + self._knowledge.prompt_context()
                  )

              def answer(self, question: str, history: tuple[Exchange, ...]) -> BotAnswer:
                  history_text = "\\n".join(
                      f"使用者：{exchange.user}\\n永恆北極星：{exchange.assistant}" for exchange in history
                  )
                  prompt = f"最近三組對話：\\n{history_text or '（無）'}\\n\\n本次問題：{question}"
                  response = self._client.responses.create(
                      model=self._model,
                      instructions=self._instructions,
                      input=prompt,
                      max_output_tokens=350,
                      reasoning={"effort": "none"},
                      store=False,
                      text={
                          "format": {
                              "type": "json_schema",
                              "name": "eternal_polaris_answer",
                              "strict": True,
                              "schema": ANSWER_SCHEMA,
                          }
                      },
                  )
                  raw = json.loads(response.output_text)
                  answer = BotAnswer(
                      label=ScienceLabel(raw["label"]),
                      answer=str(raw["answer"]).strip(),
                      source_ids=tuple(str(value) for value in raw["source_ids"]),
                      route="model",
                  )
                  return self._knowledge.validate_answer(answer)


          class HybridAnswerService:
              """Use a deterministic knowledge-card answer when confidence is high."""

              def __init__(
                  self,
                  model_service: AnswerProvider,
                  knowledge: KnowledgeBase,
                  *,
                  min_score: float = 0.46,
                  min_margin: float = 0.08,
              ) -> None:
                  self._model_service = model_service
                  self._knowledge = knowledge
                  self._min_score = min_score
                  self._min_margin = min_margin

              def answer(self, question: str, history: tuple[Exchange, ...]) -> BotAnswer:
                  card = self._knowledge.match_question(
                      question,
                      min_score=self._min_score,
                      min_margin=self._min_margin,
                  )
                  if card is not None:
                      return BotAnswer(
                          label=card.label,
                          answer="".join(card.facts),
                          source_ids=(card.id,),
                          route="local",
                      )
                  return self._model_service.answer(question, history)


          def render_answer(answer: BotAnswer, knowledge: KnowledgeBase) -> str:
              from .models import LABEL_TITLES

              if answer.label is ScienceLabel.OUT_OF_SCOPE:
                  return f"【{LABEL_TITLES[answer.label]}】\\n{OUT_OF_SCOPE_REPLY}"
              sources = "、".join(knowledge.source_names(answer.source_ids))
              return f"【{LABEL_TITLES[answer.label]}】\\n{answer.answer}\\n\\n來源：{sources}"
          '''
          lines = answer_service.splitlines()
          common = min((len(line) - len(line.lstrip()) for line in lines if line.strip()), default=0)
          Path("src/eternal_polaris/answer_service.py").write_text(
              "\n".join(line[common:] if line.strip() else "" for line in lines) + "\n",
              encoding="utf-8",
          )

          quiz_path = Path("src/eternal_polaris/quiz.py")
          quiz_text = quiz_path.read_text(encoding="utf-8")
          quiz_text = quiz_text.replace(
              '    "smithsonian_evolution": ("Smithsonian Human Origins Program", "https://humanorigins.si.edu/evidence/human-evolution"),',
              '    "smithsonian_evolution": ("OpenStax Biology 2e — Evolution and Ecology", "https://openstax.org/details/books/biology-2e"),',
          )
          quiz_text = quiz_text.replace(
              '    "nih_body": ("NIH — How the Human Body Works", "https://www.nih.gov/health-information"),',
              '    "nih_body": ("OpenStax Anatomy and Physiology 2e", "https://openstax.org/details/books/anatomy-and-physiology-2e"),',
          )
          quiz_text = quiz_text.replace(
              '    "nist_ai": ("NIST — AI Risk Management Framework", "https://www.nist.gov/itl/ai-risk-management-framework"),',
              '    "nist_algorithms": ("NIST Dictionary of Algorithms and Data Structures", "https://xlinux.nist.gov/dads/"),\n'
              '    "nist_ai": ("NIST AI Resource Center", "https://airc.nist.gov/"),\n'
              '    "nist_crypto": ("NIST Cryptographic Standards and Guidelines", "https://csrc.nist.gov/projects/cryptographic-standards-and-guidelines"),\n'
              '    "nist_genai": ("NIST AI 600-1 — Generative AI Profile", "https://doi.org/10.6028/NIST.AI.600-1"),',
          )
          quiz_text = quiz_text.replace(
              '    "nist_physics": ("NIST Physical Measurement Laboratory", "https://www.nist.gov/pml"),',
              '    "nist_physics": ("NIST Physical Measurement Laboratory", "https://www.nist.gov/pml"),\n'
              '    "openstax_physics1": ("OpenStax University Physics Volume 1", "https://openstax.org/details/books/university-physics-volume-1"),\n'
              '    "openstax_physics3": ("OpenStax University Physics Volume 3", "https://openstax.org/details/books/university-physics-volume-3"),',
          )
          marker = '        if len(self.questions) != 96 or len(self.by_id) != 96:\n            raise QuizError("題庫必須包含 96 題且 ID 不可重複")'
          hardened = (
              marker
              + '\n        for source_key, (source_name, source_url) in SOURCE_CATALOG.items():\n'
                '            if not source_name.strip() or not source_url.startswith("https://"):\n'
                '                raise QuizError(f"來源 {source_key} 的名稱或 HTTPS URL 無效")'
          )
          if '來源 {source_key} 的名稱或 HTTPS URL 無效' not in quiz_text:
              if marker not in quiz_text:
                  raise SystemExit("quiz source-catalog validation target not found")
              quiz_text = quiz_text.replace(marker, hardened, 1)
          quiz_path.write_text(quiz_text, encoding="utf-8")

          bank_path = Path("data/quiz_questions.tsv")
          with bank_path.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle, delimiter="\t")
              fieldnames = reader.fieldnames
              rows = list(reader)
          if fieldnames is None:
              raise SystemExit("quiz fieldnames missing")
          source_overrides = {
              **{f"P00{index}": "openstax_physics1" for index in range(1, 7)},
              "P022": "openstax_physics3",
              "P023": "openstax_physics3",
              "F007": "nist_algorithms",
              "F010": "nist_crypto",
              "F012": "nist_genai",
          }
          seen = set()
          for row in rows:
              if row["id"] in source_overrides:
                  row["source_key"] = source_overrides[row["id"]]
                  seen.add(row["id"])
          if seen != set(source_overrides):
              raise SystemExit(f"missing source override IDs: {set(source_overrides) - seen}")
          with bank_path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, delimiter="\t", lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)

          test_content = '''from __future__ import annotations

          import json
          from types import SimpleNamespace

          from eternal_polaris.answer_service import OpenAIAnswerService
          from eternal_polaris.quiz import SOURCE_CATALOG


          class FakeResponses:
              def create(self, **kwargs):
                  return SimpleNamespace(output_text=json.dumps({"label": "out_of_scope", "answer": "拒答", "source_ids": []}))


          def test_model_contract_does_not_overpromise_cross_domain_free_qa(knowledge):
              service = OpenAIAnswerService("key", "gpt-5.6-luna", knowledge, client=SimpleNamespace(responses=FakeResponses()))
              assert "自由問答只涵蓋" in service._instructions
              assert "地球科學、生命科學" in service._instructions
              assert "知識卡無法支持" in service._instructions


          def test_revised_sources_are_topic_relevant_and_https(quiz_bank):
              assert SOURCE_CATALOG["smithsonian_evolution"][0].startswith("OpenStax Biology")
              assert SOURCE_CATALOG["nih_body"][0].startswith("OpenStax Anatomy")
              assert SOURCE_CATALOG["nist_crypto"][1].startswith("https://csrc.nist.gov/")
              assert SOURCE_CATALOG["nist_genai"][1].startswith("https://doi.org/")
              assert all(name and url.startswith("https://") for name, url in SOURCE_CATALOG.values())
              by_id = quiz_bank.by_id
              assert by_id["F007"].source_key == "nist_algorithms"
              assert by_id["F010"].source_key == "nist_crypto"
              assert by_id["F012"].source_key == "nist_genai"
              assert by_id["P001"].source_key == "openstax_physics1"
              assert by_id["P023"].source_key == "openstax_physics3"
          '''
          test_lines = test_content.splitlines()
          test_common = min((len(line) - len(line.lstrip()) for line in test_lines if line.strip()), default=0)
          Path("tests/test_third_review.py").write_text(
              "\n".join(line[test_common:] if line.strip() else "" for line in test_lines) + "\n",
              encoding="utf-8",
          )

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          readme_text = readme_text.replace(
              "題庫共 96 題、16 個主題、四座正式寶庫：",
              "題庫共 96 題、16 個主題、四座正式寶庫；每題在回饋中顯示來源名稱與網址：",
          )
          readme.write_text(readme_text, encoding="utf-8")

          review_doc = Path("docs/quiz-design.md")
          review_text = review_doc.read_text(encoding="utf-8")
          review_text = review_text.replace(
              "使用 NASA、USGS、NOAA、NIH、NIST、DOE、CERN、LIGO、ACS 或原始論文等正式來源。",
              "使用 NASA、USGS、NOAA、NIH、NIST、DOE、CERN、LIGO、ACS、OpenStax 大學教材或原始論文等正式來源，並優先採與題目主題直接相關的落地頁。",
          )
          review_doc.write_text(review_text, encoding="utf-8")

          for obsolete in (
              ".github/workflows/apply-final-persona-fix.yml",
              ".github/workflows/apply-final-correction-v2.yml",
              ".github/workflows/final-review-v3.yml",
              ".github/workflows/final-review-v4.yml",
              ".github/workflows/final-review-v5.yml",
              "docs/verification-trigger.md",
              "docs/final-ci-trigger.md",
          ):
              Path(obsolete).unlink(missing_ok=True)
          PY

          python -m compileall -q src tests

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Third-round engineering and science gate
        run: |
          python -m pip check
          python -m compileall -q src tests
          python -m pytest --cov=eternal_polaris --cov-branch --cov-report=term-missing --cov-report=json:/tmp/coverage.json
          eternal-polaris-eval

      - name: Commit reviewed runtime
        shell: bash
        run: |
          git config user.name "SFLINE_BOT Review Committee"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Tighten QA scope and quiz source quality"
          runtime_sha="$(git rev-parse HEAD)"
          printf '%s' "$runtime_sha" > /tmp/runtime_sha

      - name: Write final expert-loop evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          coverage = json.loads(Path("/tmp/coverage.json").read_text(encoding="utf-8"))["totals"]
          collected = subprocess.check_output(["python", "-m", "pytest", "--collect-only", "-q"], text=True).strip().splitlines()[-1]
          runtime_sha = Path("/tmp/runtime_sha").read_text(encoding="utf-8")
          report = f'''# Strict review status

          - Verdict: **PASS**
          - Actionable issues after three expert loops: **0**
          - Reviewed runtime SHA: `{runtime_sha}`
          - Recorded at: `{datetime.now(timezone.utc).isoformat()}`
          - Tests collected: `{collected}`
          - Combined line/branch coverage: `{coverage["percent_covered"]:.2f}%`
          - Statements: `{coverage["num_statements"]}`; covered: `{coverage["covered_lines"]}`
          - Branches: `{coverage["num_branches"]}`; covered: `{coverage["covered_branches"]}`
          - Quiz bank: `96 questions / 16 topics / 4 formal vaults`
          - Complete simulations: `5 vault entrances × 4 difficulty entrances × 5 answers`

          ## Expert-loop corrections

          1. Replaced the original synchronous webhook path with bounded asynchronous ACK and same-user FIFO.
          2. Added deterministic Help/Challenge/Rules/Score/Quit routing and a signed five-question state machine.
          3. Removed obsolete self-modifying patch artifacts and cleared unreviewed manual scores.
          4. Corrected persona syntax, source-label integrity, empty-input handling, answer bounds and constructor guards.
          5. Corrected the capability contract so broad science belongs to the 96-question trial while free QA remains card-grounded astronomy and science-fiction physics.
          6. Tightened the internal model instruction to reject any question unsupported by the 24-card corpus.
          7. Replaced overly broad evolution, anatomy, mechanics, cryptography and generative-AI references with more topic-relevant academic or official sources.
          8. Verified signed-token tampering, cross-user use, previous-question replay, expiry, queue saturation, FIFO and all 20 vault/difficulty paths.

          `ZERO_ACTIONABLE_ISSUES`

          This certification does not claim a new physical-phone LINE E2E or a funded OpenAI online evaluation. Those remain separate external acceptance evidence.
          '''
          Path("docs/strict-review-status.md").write_text(report, encoding="utf-8")
          PY

          git add docs/strict-review-status.md
          git commit -m "Record third-round expert certification"
          git push origin HEAD:main

      - name: Dispatch and watch clean Main CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          gh workflow run ci.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id="$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$head\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "Could not locate dispatched Main CI run" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Mark latest green main
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          git fetch origin main
          test "$head" = "$(git rev-parse origin/main)"
          git tag -f quiz-reviewed "$head"
          git push --force origin refs/tags/quiz-reviewed
