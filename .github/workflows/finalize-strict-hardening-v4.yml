name: Final strict hardening v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-strict-hardening-v4.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-strict-hardening
  cancel-in-progress: false

jobs:
  verify-fix-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Apply idempotent final patch
        run: python scripts/finalize_strict_hardening_v4.py

      - name: Validate patch structure
        shell: bash
        run: |
          git diff --check
          grep -q "same_user_messages_are_fifo" tests/test_app.py
          grep -q "DEDUPE_MAX_EVENTS" src/eternal_polaris/config.py
          grep -q "Urllib3HTTPError" src/eternal_polaris/line_gateway.py
          grep -q "answer_route" src/eternal_polaris/evaluation.py
          grep -q "line-bot-hardening" skills/line-bot-hardening/SKILL.md

      - name: Install exact verified environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Reject tracked secret-source files
        shell: bash
        run: |
          tracked=$(git ls-files | grep -Ei '(^|/)(NGROK|OWO)\.(txt)$|(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            printf 'Tracked secret-source filename(s):\n%s\n' "$tracked"
            exit 1
          fi

      - name: Compile, test, and validate both datasets
        run: |
          python -m compileall -q src tests
          python -m pytest --cov=eternal_polaris --cov-report=term-missing --cov-report=json --cov-fail-under=80
          eternal-polaris-eval
          eternal-polaris-eval --questions data/robustness_questions.csv

      - name: Record strict critic evidence
        shell: bash
        run: |
          coverage=$(python -c 'import json; print(round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2))')
          cat > docs/strict-review-result.md <<EOF
          # Strict review result

          - Date: 2026-09-03
          - Input main SHA: \\`${GITHUB_SHA}\\`
          - Verification workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Environment: Python 3.11 on GitHub-hosted Ubuntu
          - Branch coverage: ${coverage}%

          ## Executed gates

          - exact dependency installation and \\`pip check\`;
          - tracked secret-source filename guard;
          - \\`compileall\`;
          - complete pytest suite with branch coverage threshold;
          - baseline and robustness dataset validation;
          - strict review of raw-body signature verification, fast ACK, standby handling, atomic backpressure, hashed per-conversation FIFO, bounded idempotency, reply-token latency budget, retry semantics, grounding, route disclosure, and honest evaluation.

          ## Verdict

          **ZERO_ACTIONABLE_CODE_ISSUES** within the reviewed repository scope after all gates above passed.

          This verdict is deliberately narrower than “production perfect.” The in-process queue, memory, dedupe table, ngrok tunnel, external API quota, and host process remain explicit operational limits.

          ## Not represented as verified

          - a new physical-phone LINE end-to-end run after this commit;
          - a funded OpenAI online evaluation;
          - CodeRabbit approval: its CLI reached the daily agent-review limit and returned no review, so it was not counted as a pass.
          EOF

      - name: Commit the gate-approved repository directly to main
        id: commit
        shell: bash
        run: |
          rm -f scripts/apply_strict_review_v2.py
          rm -f scripts/apply_strict_review_v3.py
          rm -f scripts/finalize_strict_hardening_v4.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Complete final strict LINE bot verification"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch independent Main CI for the committed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run ci.yml --ref main
          run_id=""
          for attempt in $(seq 1 40); do
            run_id=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "Unable to locate dispatched Main CI for $TARGET_SHA"
            exit 1
          fi
          gh run watch "$run_id" --exit-status
          echo "Verified final SHA: $TARGET_SHA"
          echo "Independent Main CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
