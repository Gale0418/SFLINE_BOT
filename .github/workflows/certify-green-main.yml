name: Certify green main

on:
  workflow_run:
    workflows: ["Main CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Certify only if tested commit is still current main
        shell: bash
        run: |
          git fetch origin main --tags
          tested="${{ github.event.workflow_run.head_sha }}"
          current="$(git rev-parse origin/main)"
          if [ "$tested" != "$current" ]; then
            echo "A newer main exists; its own Main CI run must certify it."
            exit 0
          fi
          git config user.name "SFLINE_BOT Certification"
          git config user.email "actions@users.noreply.github.com"
          git tag -f quiz-reviewed "$tested"
          git push --force origin refs/tags/quiz-reviewed
