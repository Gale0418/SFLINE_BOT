name: Publish reviewed guardian quiz

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-reviewed-guardian-quiz.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PATCH_URL: https://sfline-guardian-final-20260903.serveo.net/sfline-reviewed-final.tar.gz

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download final independently reviewed tree
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --connect-timeout 15 --max-time 240 "$PATCH_URL" -o /tmp/reviewed.tar.gz; then break; fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep $((attempt * 5))
          done
          mkdir /tmp/reviewed
          tar -xzf /tmp/reviewed.tar.gz -C /tmp/reviewed
          test -f /tmp/reviewed/src/eternal_polaris/quiz.py
          test -f /tmp/reviewed/src/eternal_polaris/persona.py
          test -f /tmp/reviewed/src/eternal_polaris/interaction.py
          test -f /tmp/reviewed/data/quiz_questions.json
          test -f /tmp/reviewed/scripts/strict_audit.py
          ! tar -tzf /tmp/reviewed.tar.gz | grep -Eq '(^|/)(\.env$|OWO\.[Tt][Xx][Tt]$|NGROK\.[Tt][Xx][Tt]$|\.git/)'

      - name: Replace checkout with reviewed tree
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/reviewed/ ./
          test ! -e .github/workflows/publish-reviewed-guardian-quiz.yml
          test ! -e .github/workflows/bootstrap-guardian-quiz.yml
          test ! -e .github/workflows/bootstrap-guardian-quiz-v2.yml
          test ! -e docs/push-files-probe-a.txt
          test ! -e scripts/apply_strict_review_v2.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Repeat all release gates in GitHub-hosted Linux
        run: |
          python -m compileall -q src tests scripts
          python -m pytest --cov=eternal_polaris --cov-branch --cov-report=term-missing --cov-fail-under=82
          python scripts/strict_audit.py
          eternal-polaris-eval

      - name: Commit reviewed result directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Main already matches the final reviewed tree.'
            exit 0
          fi
          git commit -m 'Publish reviewed guardian quiz and science vault'
          git push origin HEAD:main
