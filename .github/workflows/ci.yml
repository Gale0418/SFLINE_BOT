name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Dependency integrity
        run: python -m pip check

      - name: Syntax and bytecode gate
        run: python -m compileall -q src tests

      - name: Test and branch coverage gate
        run: python -m pytest --cov=eternal_polaris --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Offline knowledge evaluation schema
        run: eternal-polaris-eval
