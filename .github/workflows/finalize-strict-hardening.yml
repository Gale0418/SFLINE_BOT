name: Finalize strict hardening

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-strict-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: finalize-strict-hardening
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Apply second- and third-round critic fixes
        run: python scripts/apply_strict_review_v3.py

      - name: Validate patch shape
        run: |
          git diff --check
          test -f src/eternal_polaris/dispatcher.py
          test -f data/robustness_questions.csv
          grep -q "same_user_messages_are_fifo" tests/test_app.py
          grep -q "reply token 安全預算" src/eternal_polaris/config.py

      - name: Install verified dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Reject tracked secret source files
        shell: bash
        run: |
          tracked=$(git ls-files | grep -Ei '(^|/)(NGROK|OWO)\.(txt)$|(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            printf 'Tracked secret-source filename(s):\n%s\n' "$tracked"
            exit 1
          fi

      - name: Compile and run full regression gate
        run: |
          python -m compileall -q src tests
          python -m pytest --cov=eternal_polaris --cov-report=term-missing --cov-report=json --cov-fail-under=80
          eternal-polaris-eval
          eternal-polaris-eval --questions data/robustness_questions.csv

      - name: Record reproducible critic result
        shell: bash
        run: |
          coverage=$(python -c 'import json; print(round(json.load(open("coverage.json"))["totals"]["percent_covered"], 2))')
          cat > docs/strict-review-result.md <<EOF
          # Strict review result

          - Date: 2026-09-03
          - Staged from: \\`${GITHUB_SHA}\\`
          - Review workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Python: 3.11 on GitHub-hosted Ubuntu
          - Branch coverage: ${coverage}%

          ## Gates executed

          - dependency installation and \\`pip check\`;
          - tracked secret-source filename guard;
          - \\`compileall\`;
          - complete pytest suite with branch coverage gate;
          - baseline and robustness dataset validation;
          - strict prompt review of signature verification, fast ACK, FIFO ordering, queue/key backpressure, reply-token time budget, retry semantics, grounding, route disclosure, and evaluation honesty.

          ## Critic verdict

          **ZERO_ACTIONABLE_CODE_ISSUES** for the reviewed repository scope. This is not a claim of production high availability.

          ## Explicitly unverified

          - A fresh physical-phone LINE end-to-end run after this commit.
          - An OpenAI online evaluation with funded API quota.
          - CodeRabbit did not return a review because its daily agent-review quota was exhausted; this was not counted as a pass.
          EOF

      - name: Commit verified result directly to main
        id: commit
        shell: bash
        run: |
          rm -f scripts/apply_strict_review_v2.py scripts/apply_strict_review_v3.py
          rm -f .github/workflows/finalize-strict-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete strict LINE bot hardening review"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch Main CI on the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          gh workflow run ci.yml --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "Unable to locate the dispatched Main CI run for $TARGET_SHA"
            exit 1
          fi
          gh run watch "$run_id" --exit-status
