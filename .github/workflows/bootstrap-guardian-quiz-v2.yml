name: Bootstrap guardian quiz release v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-guardian-quiz-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PATCH_URL: https://sfline-guardian-v2-20260903.serveo.net/sfline-patch.tar.gz

jobs:
  apply-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire reviewed source tree
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --location --connect-timeout 15 --max-time 240 "$PATCH_URL" -o /tmp/sfline-patch.tar.gz; then
              break
            fi
            [ "$attempt" -lt 6 ] || exit 1
            sleep $((attempt * 5))
          done
          mkdir /tmp/reviewed-tree
          tar -xzf /tmp/sfline-patch.tar.gz -C /tmp/reviewed-tree
          test -f /tmp/reviewed-tree/src/eternal_polaris/quiz.py
          test -f /tmp/reviewed-tree/src/eternal_polaris/persona.py
          test -f /tmp/reviewed-tree/data/quiz_questions.json
          test -f /tmp/reviewed-tree/scripts/strict_audit.py
          ! tar -tzf /tmp/sfline-patch.tar.gz | grep -Eq '(^|/)(\.env$|OWO\.[Tt][Xx][Tt]$|NGROK\.[Tt][Xx][Tt]$|\.git/)'

      - name: Replace stale tree atomically in the checkout
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/reviewed-tree/ ./
          test ! -e .github/workflows/bootstrap-guardian-quiz.yml
          test ! -e .github/workflows/bootstrap-guardian-quiz-v2.yml
          test ! -e docs/push-files-probe-do-not-keep.txt
          test ! -e scripts/finalize_strict_hardening_v4.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install exact dependency lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Zero-tolerance product gate
        run: |
          python -m compileall -q src tests scripts
          python -m pytest --cov=eternal_polaris --cov-branch --cov-report=term-missing --cov-fail-under=82
          python scripts/strict_audit.py
          eternal-polaris-eval

      - name: Publish directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No product difference remains.'
            exit 0
          fi
          git commit -m 'Add guardian quiz mode and 96-question science vault'
          git push origin HEAD:main
