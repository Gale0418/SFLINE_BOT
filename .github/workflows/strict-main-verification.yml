name: Strict main verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strict-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-actionable-code-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify final repository shape
        shell: bash
        run: |
          test -f docs/strict-review-result.md
          test -f docs/strict-review-prompt.md
          test -f skills/line-bot-hardening/SKILL.md
          test -f data/robustness_questions.csv
          test -f src/eternal_polaris/dispatcher.py
          test ! -e scripts/apply_strict_review_v2.py
          test ! -e scripts/apply_strict_review_v3.py
          test ! -e scripts/finalize_strict_hardening_v4.py
          grep -q "ZERO_ACTIONABLE_CODE_ISSUES" docs/strict-review-result.md
          grep -q "same_user_messages_are_fifo" tests/test_app.py
          grep -q "DEDUPE_MAX_EVENTS" src/eternal_polaris/config.py
          grep -q "max_pending_per_key" src/eternal_polaris/dispatcher.py
          grep -q "_request_timeout" src/eternal_polaris/line_gateway.py
          grep -q "answer_route" src/eternal_polaris/evaluation.py
          git diff --check

      - name: Reject tracked secret-source files
        shell: bash
        run: |
          tracked=$(git ls-files | grep -Ei '(^|/)(NGROK|OWO)\.(txt)$|(^|/)\.env($|\.)' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            printf 'Tracked secret-source filename(s):\n%s\n' "$tracked"
            exit 1
          fi

      - name: Install exact dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Compile and run the full regression suite
        run: |
          python -m compileall -q src tests
          python -m pytest --cov=eternal_polaris --cov-report=term-missing --cov-fail-under=80

      - name: Validate baseline and robustness evaluation assets
        run: |
          eternal-polaris-eval
          eternal-polaris-eval --questions data/robustness_questions.csv
