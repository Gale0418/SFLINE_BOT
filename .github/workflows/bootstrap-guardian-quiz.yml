name: Bootstrap guardian quiz release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-guardian-quiz.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PATCH_URL: https://sfline-gale0418-20260903.serveo.net/sfline-patch.tar.gz

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact reviewed tree
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 180 "$PATCH_URL" -o /tmp/sfline-patch.tar.gz
          mkdir /tmp/reviewed-tree
          tar -xzf /tmp/sfline-patch.tar.gz -C /tmp/reviewed-tree
          test -f /tmp/reviewed-tree/src/eternal_polaris/quiz.py
          test -f /tmp/reviewed-tree/data/quiz_questions.json
          test -f /tmp/reviewed-tree/scripts/strict_audit.py
          ! tar -tzf /tmp/sfline-patch.tar.gz | grep -Eq '(^|/)(\.env$|OWO\.[Tt][Xx][Tt]$|NGROK\.[Tt][Xx][Tt]$|\.git/)'

      - name: Replace repository tree without secrets or stale finalizers
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/reviewed-tree/ ./
          test ! -e .github/workflows/bootstrap-guardian-quiz.yml
          test ! -e docs/push-files-probe-a.txt
          test ! -e scripts/apply_strict_review_v2.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Run zero-tolerance local gates before commit
        run: |
          python -m compileall -q src tests scripts
          python -m pytest --cov=eternal_polaris --cov-branch --cov-report=term-missing --cov-fail-under=82
          python scripts/strict_audit.py
          eternal-polaris-eval

      - name: Commit directly to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Reviewed tree already matches main.'
            exit 0
          fi
          git commit -m 'Add guardian quiz mode and 96-question science vault'
          git push origin HEAD:main
