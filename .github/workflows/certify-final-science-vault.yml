name: Release certification

on:
  workflow_run:
    workflows: ["Main CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-certification-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  certify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify release contract without mutating main
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import sys
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          tested_sha = "${{ github.event.workflow_run.head_sha }}"

          # Load the production quiz implementation directly. quiz.py is
          # intentionally stdlib-only, so certification does not need secrets
          # or network/package installation.
          quiz_path = root / 'src/eternal_polaris/quiz.py'
          spec = importlib.util.spec_from_file_location('certified_quiz', quiz_path)
          assert spec and spec.loader
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          bank = module.QuizBank.load(root / 'data/quiz_questions.tsv')

          assert len(bank.questions) == 96
          assert len(bank.by_id) == 96
          topic_counts = Counter(question.topic for question in bank.questions)
          assert len(topic_counts) == 16
          assert set(topic_counts.values()) == {6}

          formal_vaults = set(module.VAULTS) - {'all'}
          difficulties = set(module.DIFFICULTY_NAMES) - {'mixed'}
          pair_counts = Counter((q.vault, q.difficulty) for q in bank.questions)
          assert pair_counts == Counter({
              (vault, difficulty): 8
              for vault in formal_vaults
              for difficulty in difficulties
          })
          assert Counter(q.correct_letter for q in bank.questions) == Counter({
              'A': 24, 'B': 24, 'C': 24, 'D': 24,
          })
          for vault in formal_vaults:
              for difficulty in difficulties:
                  positions = Counter(
                      q.correct_letter for q in bank.questions
                      if q.vault == vault and q.difficulty == difficulty
                  )
                  assert positions == Counter({'A': 2, 'B': 2, 'C': 2, 'D': 2})

          required = {
              'src/eternal_polaris/app.py',
              'src/eternal_polaris/answer_service.py',
              'src/eternal_polaris/config.py',
              'src/eternal_polaris/dispatcher.py',
              'src/eternal_polaris/line_gateway.py',
              'src/eternal_polaris/persona.py',
              'src/eternal_polaris/quiz.py',
              'data/knowledge_cards.json',
              'data/quiz_questions.tsv',
              'docs/ai-providers.md',
              'docs/architecture.md',
              '.github/workflows/ci.yml',
              '.github/workflows/certify-final-science-vault.yml',
          }
          assert all((root / path).is_file() for path in required)

          # Only persistent validation workflows may remain. Old bootstrap,
          # publish, tag-moving and self-modifying finalizers are forbidden.
          workflow_names = {
              path.name for path in (root / '.github/workflows').glob('*.yml')
          }
          assert workflow_names == {
              'ci.yml',
              'certify-final-science-vault.yml',
          }, workflow_names

          config_text = (root / 'src/eternal_polaris/config.py').read_text(encoding='utf-8')
          answer_text = (root / 'src/eternal_polaris/answer_service.py').read_text(encoding='utf-8')
          readme = (root / 'README.md').read_text(encoding='utf-8')
          assert 'AI_PROVIDER' in config_text
          assert 'gemma-4-31b-it' in config_text
          assert 'gpt-5.6-luna' in config_text
          assert 'generativelanguage.googleapis.com' in answer_text
          assert 'x-goog-api-key' in answer_text
          assert '不做執行時跨供應商' in readme
          assert not (root / '.env').exists()

          print(f'RELEASE_CERTIFIED sha={tested_sha} questions={len(bank.questions)} topics={len(topic_counts)}')
          PY
