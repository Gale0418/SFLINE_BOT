[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eternal-polaris-line-bot"
version = "0.3.0"
description = "永恆北極星：LINE 跨域科學問答與星之試煉機器人"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "Flask>=3.1,<4",
  "httpx>=0.28,<1",
  "line-bot-sdk>=3.25,<4",
  "openai>=2.0,<3",
  "python-dotenv>=1.1,<2",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
eternal-polaris = "eternal_polaris.__main__:main"
eternal-polaris-eval = "eternal_polaris.evaluation:main"
eternal-polaris-migrate-secrets = "eternal_polaris.secret_migration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eternal_polaris = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --strict-markers"

[tool.coverage.run]
branch = true
source = ["eternal_polaris"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\.\.\.",
]
